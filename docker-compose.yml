services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shodh
      POSTGRES_PASSWORD: shodh
      POSTGRES_DB: shodh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shodh -d shodh"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  judge-image:
    image: shodh-judge:v1
    build:
      context: ./Backend/docker/judge
      dockerfile: Dockerfile
    command: ["true"]

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://shodh:shodh@postgres:5432/shodh
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JUDGE_IMAGE: shodh-judge:v1
      JUDGE_TIMEOUT_MS: ${JUDGE_TIMEOUT_MS:-60000}
      MAX_SOURCE_CODE_BYTES: ${MAX_SOURCE_CODE_BYTES:-102400}
      JUDGE_VERSION: judge-v1
    volumes:
      # Required so this API process can start sibling judge containers.
      # The socket grants the backend engine-level Docker access. See README.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge-image:
        condition: service_completed_successfully

  ai:
    build:
      context: ./ai
    ports:
      - "8000:8000"
    environment:
      BACKEND_URL: http://backend:3000
      # Own table only (ai_material_embeddings); public learning material embeddings, no user data.
      DATABASE_URL: postgresql://shodh:shodh@postgres:5432/shodh
      # Gemini key stays server-side (this container only). Without it the assistant runs evidence-only.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.5-flash,gemini-2.5-flash-lite}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-gemini-embedding-001}
      AI_TIMEOUT_S: ${AI_TIMEOUT_S:-20}
      AI_RATE_LIMIT_PER_HOUR: ${AI_RATE_LIMIT_PER_HOUR:-60}
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
      - ai

volumes:
  postgres_data:
