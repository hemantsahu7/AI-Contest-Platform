services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shodh
      POSTGRES_PASSWORD: shodh
      POSTGRES_DB: shodh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shodh -d shodh"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    # Persistent GRAPH projection (relationships for GraphRAG). PostgreSQL stays the source of truth; this is derived from it.
    image: neo4j:5.26.30-community
    environment:
      # Only used the first time the data volume is created. Changing it later needs `docker compose down -v`.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-shodh-graph-dev}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      # Optional, localhost only: Neo4j Browser and Bolt for inspecting the graph. The application reaches Neo4j on the
      # compose network (bolt://neo4j:7687) and does not need these.
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  judge-image:
    image: shodh-judge:v1
    build:
      context: ./Backend/docker/judge
      dockerfile: Dockerfile
    command: ["true"]

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://shodh:shodh@postgres:5432/shodh
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JUDGE_IMAGE: shodh-judge:v1
      JUDGE_TIMEOUT_MS: ${JUDGE_TIMEOUT_MS:-60000}
      MAX_SOURCE_CODE_BYTES: ${MAX_SOURCE_CODE_BYTES:-102400}
      JUDGE_VERSION: judge-v1
    volumes:
      # Required so this API process can start sibling judge containers.
      # The socket grants the backend engine-level Docker access. See README.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge-image:
        condition: service_completed_successfully

  ai:
    build:
      context: ./ai
    ports:
      - "8000:8000"
    environment:
      BACKEND_URL: http://backend:3000
      # Own table only (ai_material_embeddings); public learning material embeddings, no user data.
      DATABASE_URL: postgresql://shodh:shodh@postgres:5432/shodh
      # Graph projection (Neo4j). The AI service starts even while Neo4j is still booting and degrades to the in-memory fallback.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-shodh-graph-dev}
      GRAPH_SYNC_INTERVAL_S: ${GRAPH_SYNC_INTERVAL_S:-20}
      AI_AGENT_PLANNER: ${AI_AGENT_PLANNER:-policy}
      AI_AGENT_MAX_STEPS: ${AI_AGENT_MAX_STEPS:-4}
      AI_AGENT_ENABLED: ${AI_AGENT_ENABLED:-1}
      AI_AGENT_TOOL_TIMEOUT_S: ${AI_AGENT_TOOL_TIMEOUT_S:-8}
      GRAPH_FULL_REBUILD_INTERVAL_S: ${GRAPH_FULL_REBUILD_INTERVAL_S:-600}
      GRAPH_QUERY_TIMEOUT_S: ${GRAPH_QUERY_TIMEOUT_S:-6}
      # Gemini key stays server-side (this container only). Without it the assistant runs evidence-only.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL_DISABLED: ${AI_MODEL_DISABLED:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.5-flash,gemini-3.7-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-gemini-embedding-001}
      AI_TIMEOUT_S: ${AI_TIMEOUT_S:-20}
      AI_RATE_LIMIT_PER_HOUR: ${AI_RATE_LIMIT_PER_HOUR:-60}
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started   # not service_healthy: a slow/failed graph store must never block the application

  frontend:
    build:
      context: ./Frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
      - ai

volumes:
  postgres_data:
  neo4j_data:
